server.address=0.0.0.0
server.port=${PORT:8080}
spring.application.name=public-transport-system

# Safe default in-memory datasource
spring.datasource.url=jdbc:h2:mem:transport_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# Disable H2 web console by default in production to avoid premature connection scans
spring.h2.console.enabled=false

# Static resource handling
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging
logging.level.com.vcet.transport=INFO
logging.level.org.springframework.web=INFO
